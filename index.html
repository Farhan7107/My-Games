
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Games</title>
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  background: #eaf2ff;
  margin: 0;
}
header {
  background: #0878f9;
  color: white;
  padding: 20px;
}
.game {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 12px;
}
button {
  background: #0878f9;
  color: white;
  padding: 12px 20px;
  border: 0;
  border-radius: 8px;
}
</style>
</head>
<body>
<header>
  <h1>🎮 My Games</h1>
  <p>Play Free Games Online</p>
</header>

<div class="game">
  <h2>🎯 Number Game</h2>
  <p id="result">Press the button to play!</p>
  <button onclick="playGame()">Play Now</button>
</div>

<div class="game">
  <h2>🧮 Math Game</h2>
  <p id="math">2 + 3 = ?</p>
  <button onclick="showAnswer()">Show Answer</button>
</div>

<script>
function playGame() {
  let n = Math.floor(Math.random() * 5) + 1;
  document.getElementById("result").textContent =
    "Your number is " + n + "!";
}
function showAnswer() {
  document.getElementById("math").textContent =
    "Correct answer: 5!";
}
</script>
</body>
</html>
